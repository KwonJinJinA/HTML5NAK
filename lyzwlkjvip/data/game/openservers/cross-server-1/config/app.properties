#########################################baseconfig##########################################
#服务器唯一标识从1(0用作场景中临时标识)开始计数必须全局唯一最大4095
base.id=10001

#服务器类型1游戏服务器,2跨服服务器
base.type=2
#联运平台
base.platformId=xiyou_uc
#调试模式(true:聊天框内输出调试信息/允许debug命令)
base.debug=true

base.openTime=2022-01-01 00:00:00

#entryName
base.entryName=跨服1区

base.mail=true

##########################################后台config##########################################
#后台地址
gmtools_server_url=http://106.52.186.251:8080/center/

#充值回调
recharge_callback=http://139.199.177.149:8001/centerserver/sdkCharge

#后台监控接口如果不想开可以注掉
base.web=9578

#自动创建角色
base.autoRole=false
#是不是使用blockingqueue，false就使用disruptor
base.bq=false

base.cross=true

##########################################masterconfig##########################################

#当前服务器内网IP
ip.in=127.0.0.1
#对外开放的域名或IP
ip.out=122.51.27.223

#redis密码没有密码什么都不用填写
redis_password=game10086...A123456...
#全局(global)redis地址(index:IP:port:)
global_redis=127.0.0.1:6379:30
#全局的聊天监控redis这个是聊天监控用的实时聊天监控
chat_redis=127.0.0.1:6379:30
#游戏(game)redis地址(IP:port:index)(当前游戏区在第几个目录,index就写几)
game_redis=127.0.0.1:6379:30
#role_redis这个是缓存所有服所有玩家的redis，具体缓存了哪些要问下朱兴生index是固定的后台设置的是index1
role_redis=127.0.0.1:6379:30
#红颜子嗣redis
beauty_redis=127.0.0.1:6379:30

##########################################shareconfig##########################################
#策划数据
#share.local=F:\\project2\\config\\trunk\\data\\zhcn
share.local=/data/game/cfgs/xycfg
#热加载配置(填写本地地址的)
hot.local=/data/game/cfgs/xycfg
#热加载配置是否在本地(true读取本地的false远程拉取)
hot.isLocal=true
#热加载不在本地时，远程拉取的地址
hot.url=http://192.168.1.231:8080/admin-tools/upload/activity/

#游戏代号，多玩平台提供的游戏代号用于聊天记录上报
yygamename=YYZS


#游戏所需语言环境(韩国版ko(KR),英文版en,中文zh(CN/TW)
share.language=zh
#充值功能是否开启
#YB兑换比例(zh->10,ko->1)
share.exchangeRate=10
share.offlineMinute=0

