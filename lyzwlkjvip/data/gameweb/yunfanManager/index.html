	<script type="text/javascript">
		function copyClip(str)
		{
			var flag = false;
			try
			{
				//var div = document.getElementById("divCopy");
				//var copyText = document.createElement("input");
				//copyText.type = "text";
				//div.appendChild(copyText);
				//copyText.value = str;
				//copyText.select();
				var aux = document.createElement("input"); 
				aux.setAttribute("value", str); 
				document.body.appendChild(aux); 
				aux.select();
				flag = document.execCommand("copy");
				document.body.removeChild(aux);
				//div.removeChild(copyText);
			}
			catch (e)
			{
				return false;
			}
			return flag;
		}

		var selectFilehandler;
		function hideFileContent(){
			var div1 = document.getElementById('loadFile');
			var c = document.getElementById('input');
			if(div1){
				div1.style.display="none";
			}
			if(selectFilehandler){
				selectFilehandler = null;
			}
		}
		function showFileContent(left1,top1,handler){
			var div1 = document.getElementById('loadFile');
			var c = document.getElementById('input');
			selectFilehandler = handler;
			if(!div1){
				div1 = document.createElement('div');
				div1.setAttribute("id","loadFile");
				c = document.createElement('input');
				c.setAttribute("id","fi");
				c.setAttribute("type","file");
				var lc = document.getElementById('layaContainer');
				lc.appendChild(div1);
				div1.appendChild(c);
				c.addEventListener('change',
						function selectedFileChanged(data) {
							if(selectFilehandler){
								if(this.files.length > 0){
									//selectFilehandler.runWith(this.files[0].path);
									var file = this.files[0];
									var reader = new FileReader();
									if (/text+/.test(file.type) || /json+/.test(file.type)) {//判断文件类型，是不是text类型
										  reader.onload = function() {
											 selectFilehandler.runWith(this.result);
										  }
										 reader.readAsText(file);
									 }
								}
							}
						});
			}
			div1.setAttribute("style","position: absolute; z-index: 100000;left:"+left1+"px;top:"+top1+"px;");
			div1.style.display="block";
		}
		function saveAs(blob, filename){
			var type = blob.type;
			var force_saveable_type = 'application/octet-stream';
			if (type && type != force_saveable_type) { // 强制下载，而非在浏览器中打开
				var slice = blob.slice || blob.webkitSlice || blob.mozSlice;
				blob = slice.call(blob, 0, blob.size, force_saveable_type);
			}

			var url = URL.createObjectURL(blob);
			var save_link = document.createElementNS('http://www.w3.org/1999/xhtml', 'a');//方法可创建带有指定命名空间的元素节点。
			save_link.href = url;
			save_link.download = filename;

			var event = document.createEvent('MouseEvents');
			event.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
			save_link.dispatchEvent(event);
			URL.revokeObjectURL(url);
		}
	</script>
