			for (var i = 0; i < vars.length; i++) {
				var pair = vars[i].split("=");
				if (pair[0] == queryName) { return pair[1]; }

		}
		var myCustomOnError = function (errorMsg , scriptURI, lineNumer , columnNumber,errorObj )

			debugger
			if(errorObj)
			{
				var info = errorMsg +"</br>"+ scriptURI + "</br>错误行数："+lineNumer+"列数："+columnNumber+"</br>";

				errReport("error",info);

		}

		function copyClip(str)
		{
			var flag = false;
			try
			{
				var div = document.getElementById("divCopy");
				var copyText = document.createElement("input");
				copyText.type = "text";
				div.appendChild(copyText);
				copyText.value = str;
				copyText.select();
				flag = document.execCommand("Copy");
				div.removeChild(copyText);
			}
			catch (e)
			{
				return false;
			}
			return flag;
		}
