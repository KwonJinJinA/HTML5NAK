    <script>
        function fanli() {
            var fanli = $("[name='fanli']").val();
            if(fanli != 0){
                layer.confirm("累充奖励均可得加领取（如500可领取300、100等）", { title: "温馨提示" }, function () {
                    $.post("player.php", {type: 'fanli', fanli: fanli}, function (data) {
                        layer.msg(data);
                    });
                });
            }else {
                layer.msg('请选择领取的套餐');
            }
        }
        
        function getFanMoney() {
            var fanmoney = $("[name='fanmoney']").val();
            if(fanmoney != 0){
                layer.confirm("累充奖励均可得加领取（如500可领取300、100等）", { title: "温馨提示" },function () {
                    $.post("player.php", {type: 'getFanMoney', fanmoney: fanmoney}, function (data) {
                        layer.msg(data);
                    });
                });
            }else {
                layer.msg('请选择领取的累充奖励');
            }
        }

        function getShop () {
            var shopId = $("[name='shopId']").val();
            if(shopId != 0){
                $.ajax({
                    url: 'player.php',
                    type: 'post',
                    dataType: 'json',
                    data: {type: 'getShop'},
                    success: function(data) {
                        if (data.code == 1) {
                            var shopName = '';
                            for (const item of data.data) {
                                if(item.id === shopId){
                                    shopName = item.name;
                                }
                            }
                            layer.confirm("确认兑换【"+shopName+"】？", { title: "温馨提示" },function () {
                                ajax('api.php?act=buy', {id: shopId});
                            });
                        }
                    }
                });
                
            }else {
                layer.msg('请选择要购买的商品');
            }
        }

        function showShopInfo(shopId) {
            $.ajax({
                url: 'player.php',
                type: 'post',
                dataType: 'json',
                data: {type: 'getShop'},
                success: function(data) {
                    if (data.code == 1) {
                        for (const item of data.data) {
                            if(item.id === shopId){
                                $("#shopInfo").html('商品说明：' + item.info);
                            }
                        }
                    }
                }
            });
        }

        function cdk() {
            $.confirm({
                title: '温馨提示',
                content: '' +
                '<form class="formName">' +
                '<div class="form-group">' +
                '<label>CDK兑换（联系客服赞助获取）</label>' +
                '<input type="text" name="km" placeholder="请输入您的CDK兑换码" class="cdk form-control" required />' +
                '</div>' +
                '</form>',
                buttons: {
                    formSubmit: {
                        text: '提交',
                        btnClass: 'btn-blue',
                        action: function () {
                            var km = $("input[name='km']").val();
                            if(!km){
                                $.alert('请输入您的CDK兑换码');
                                return false;
                            }
                            layer.load(1);
                            $.ajax({
                                url: 'api.php?act=recharge',
                                type: 'post',
                                dataType: 'json',
                                data: {km:km},
                                success: function (data) {
                                    console.log(data);
                                    layer.closeAll('loading');
                                    layer.msg(data.msg);
                                },
                                error: function (error) {
                                    layer.closeAll('loading');
                                    layer.msg('服务器错误！');
                                }
                            });
                        }
                    },
                    cancel: {
                        text: '取消'
                    },
                },
                onContentReady: function () {
                    var jc = this;
                    this.$content.find('form').on('submit', function (e) {
                        e.preventDefault();
                        jc.$$formSubmit.trigger('click');
                    });
                }
            });
        }
        
        
        function daySign(uid) {
        layer.confirm("每日福利10商城币+30首冲" , { title: "温馨提示" },function () {
                $.post("player.php", {
                    type: 'qiandao', uid: uid
                }, function (data) {
                    layer.msg(data);
                });
            });
        }    



        function vipSign(uid, allch) {
            layer.confirm("当前您的"+ getVipLevel(allch).level +"，每日可领取"+getVipLevel(allch).sign+"商城币" , { title: "温馨提示" },function () {
                if (uid == '') {
                    layer.msg('游戏账号不能为空');
                    return false;
                }
                $.post("player.php", {
                    type: 'sign', uid: uid
                }, function (data) {
                    layer.msg(data);
                });
            });
        }
        
        function getBlessBag() {
            layer.confirm("您确定要消耗10兑换币开启福袋吗？" , { title: "温馨提示" },function () {
                $.post("player.php", {
                    type: 'shilian',
                }, function (data) {
                    layer.msg(data);
                });
            });
        }
        
        function getUseInfo() {
            layer.confirm("<span style='color:red;'>平台说明：</span><br/><br/>商城币=可每天签到白嫖领取<br/>兑换商品消耗商城币<br/>" , { title: "使用说明" },function () {
                layer.closeAll();
            });
        }

        function nullMsg() {
            layer.msg('暂无功能');
        }

        function getVipLevel(allch)
        {
            if (allch >= 20000) {
                return {level: '定制会员',sign: '500'};
            } else if (allch >= 10000) {
                return {level: '王者会员',sign: '300'};
            } else if (allch >= 6000) {
                return {level: '皇冠会员',sign: '200'};
            } else if (allch >= 3000) {
                return {level: '钻石会员',sign: '150'};
            } else if (allch >= 1000) {
                return {level: '铂金会员',sign: '100'};
            } else if (allch >= 500) {
                return {level: '黄金会员',sign: '60'};
            } else if (allch >= 100) {
                return {level: '白银会员',sign: '30'};
            } else if (allch >= 0) {
                return {level: '普通会员',sign: '0'};
            }
        }
        
        function logout() {
            layer.confirm("您确定要退出系统吗？" , { title: "温馨提示" },function () {
                layer.msg('退出');
                window.location.href='/user/login.php?logout=1'
            });
        }
